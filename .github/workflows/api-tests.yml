name: API tests

on:
  push:
  pull_request:
  schedule:
    # Daily at 12:00 UTC. The public API is shared, so the suite creates its own bookings.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Newman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-html-report
          path: |
            reports/*.html
            reports/*.json
          if-no-files-found: warn
          retention-days: 14
